# =============================================================
# FILE: ghost-ai-scanner/src/pyproject.toml
# VERSION: 0.1.0
# UPDATED: 2026-05-18
# OWNER: Giggso Inc (Ravi Venugopal)
# PURPOSE: Package ghost-ai-scanner/src as `patronai-core`.
#          Enterprise Edition installs this to share business
#          logic (signal_classifier, BlobIndexStore, stores).
# =============================================================

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "patronai-core"
version     = "0.1.0"
description = "PatronAI core — AI governance signal classification and storage"
requires-python = ">=3.13"
license     = { text = "Proprietary — Giggso Inc" }
authors     = [{ name = "Giggso Inc", email = "giggso.ravi@gmail.com" }]

dependencies = [
    "boto3>=1.34",
    "polars>=0.20",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "requests>=2.31",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.34",
    "plotly>=5.22",
    "altair>=5.3",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
# src layout — package root is this directory
packages = [
    "alerter",
    "chat",
    "identity_resolver",
    "ingestor",
    "jobs",
    "matcher",
    "normalizer",
    "notify",
    "query",
    "reporter",
    "scoring",
    "services",
    "store",
    "summarizer",
]
# Top-level modules shipped as-is
include = ["*.py"]

[tool.hatch.build.targets.sdist]
exclude = ["__pycache__", "*.pyc", ".raven"]
